# Pushing a tag like v0.2.0 builds the module, signs it and publishes a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Before the key exists on this runner, so nothing the build pulls in ever sees it.
      - name: Build and test
        run: mvn -B -q package -Dmodule-base-version="$VERSION"

      - name: Prepare signing key
        env:
          PFX_BASE64: ${{ secrets.MATTER_SIGNING_PFX_BASE64 }}
          KEY_PASSWORD: ${{ secrets.MATTER_SIGNING_PASSWORD }}
        run: |
          [ -n "$PFX_BASE64" ] && [ -n "$KEY_PASSWORD" ] || { echo "::error::signing secrets are not set"; exit 1; }
          keys="$RUNNER_TEMP/keys"
          mkdir -m 700 "$keys"
          printenv PFX_BASE64 | base64 -d > "$keys/module-signing.pfx"
          printenv KEY_PASSWORD | tr -d '\n' > "$keys/module-signing.password"
          keytool -exportcert -rfc -alias kyvis-module-signing -keystore "$keys/module-signing.pfx" \
            -storepass:env KEY_PASSWORD -file "$keys/module-signing.crt"
          echo "SIGNING_DIR=$keys" >> "$GITHUB_ENV"

      - name: Build signed module
        run: scripts/build.sh -DskipTests -Dmodule-base-version="$VERSION"

      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Check signature and stage
        run: |
          mkdir dist
          f=matter-tag-provider-build/target/Matter-Tag-Provider.modl
          unzip -l "$f" | grep -q signatures.properties || { echo "::error::$f has no signatures"; exit 1; }
          unzip -p "$f" module.xml | grep -q "<version>$VERSION\." || { echo "::error::module version is not $VERSION"; exit 1; }
          cp "$f" "dist/Matter-Tag-Provider-$VERSION.modl"
          cd dist && sha256sum *.modl > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.modl dist/SHA256SUMS --verify-tag --generate-notes
